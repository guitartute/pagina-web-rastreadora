<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Tracker - Eurotrip</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-wrapper">
    <div class="glass-card">
        <h1 id="header-title">Mi Eurotrip 2026</h1>
        
        <div class="navigation-row">
            <!-- Recuadro Ayer -->
            <div class="side-box">
                <span>Ayer</span>
                <div id="ayer-destino" class="small-text">---</div>
            </div>

            <!-- Centro Hoy -->
            <div class="main-display">
                <div id="ubicacion" class="current-city">Cargando...</div>
                <div id="clock" class="digital-clock">00:00:00</div>
            </div>

            <!-- Recuadro Mañana -->
            <div class="side-box">
                <span>Mañana</span>
                <div id="mañana-destino" class="small-text">---</div>
            </div>
        </div>

        <p id="notas" class="travel-notes"></p>
    </div>
</div>

    <!-- SDK de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
