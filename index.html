<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Tracker - Eurotrip</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="contenedor-principal">
        <!-- Es vital que estos IDs coincidan con el script.js -->
        <h1 id="header-title">Cargando...</h1>
        <div id="ubicacion" class="destino">Conectando con Supabase...</div>
        <div id="clock" class="hora">00:00:00</div>
        <p id="notas" class="info-extra"></p>

        <div class="pista-vuelo">
            <span class="avion">✈️</span>
        </div>
    </div>

    <!-- SDK de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
