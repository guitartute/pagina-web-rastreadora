<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Tracker - Eurotrip</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="contenedor-principal">
        <h1 id="header-title">Mi Viaje</h1>
        
        <!-- Recuadro lateral: Ayer -->
        <div id="container-ayer" class="cuadro-transparente">
            <small>Ayer</small>
            <div id="ayer-destino">---</div>
        </div>
    
        <!-- Centro: Hoy -->
        <div id="ubicacion" class="destino-principal">Cargando...</div>
        <div id="clock" class="hora-grande">00:00:00</div>
    
        <!-- Recuadro lateral: Mañana -->
        <div id="container-mañana" class="cuadro-transparente">
            <small>Mañana</small>
            <div id="mañana-destino">---</div>
        </div>
    
        <p id="notas" class="info-notas"></p>
    </div>

    <!-- SDK de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
