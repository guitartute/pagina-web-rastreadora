<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Tracker - Eurotrip</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="tracker-container">
    <div class="glass-morphism">
        <header>
            <h1 id="header-title">MI EUROTRIP</h1>
        </header>

        <main class="main-content">
            <div id="ubicacion" class="city-name">Cargando...</div>
            <div id="clock" class="digital-time">00:00:00</div>
        </main>

        <footer class="history-grid">
            <div class="history-item">
                <span class="label">Ayer</span>
                <div id="ayer-destino" class="val">---</div>
            </div>
            <div class="history-item">
                <span class="label">Mañana</span>
                <div id="mañana-destino" class="val">---</div>
            </div>
        </footer>

        <div id="notas" class="travel-notes"></div>
    </div>
</div>

    <!-- SDK de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
