<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Tracker - Eurotrip</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-wrapper">
    <!-- Efectos de luz de fondo -->
    <div class="blob"></div>
    
    <div class="glass-container">
        <div class="status-badge">Live Tracker</div>
        
        <header>
            <div id="ubicacion" class="city-display">---</div>
            <div id="clock" class="main-clock">00:00:00</div>
        </header>

        <div class="progress-area">
            <div class="progress-bar">
                <div id="progress-fill" class="fill"></div>
            </div>
            <div class="progress-labels">
                <span>00:00</span>
                <span>24:00</span>
            </div>
        </div>

        <div class="itinerary-footer">
            <div class="step-card">
                <span class="step-label">Ayer</span>
                <div id="ayer-destino" class="step-val">---</div>
            </div>
            <div class="step-card">
                <span class="step-label">Mañana</span>
                <div id="mañana-destino" class="step-val">---</div>
            </div>
        </div>

        <div id="notas" class="notes-panel"></div>
    </div>
</div>
    <!-- SDK de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
